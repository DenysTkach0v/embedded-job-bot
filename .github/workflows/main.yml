name: Embedded jobs to Telegram

on:
  schedule:
    - cron: '17 6,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embedded-job-bot
  cancel-in-progress: false

jobs:
  search:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check logic
        run: python -m unittest discover -s tests -v

      - name: Restore delivery history
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python state_store.py pull

      - name: Find and send jobs
        id: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save delivery history
        if: ${{ always() && steps.state.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python state_store.py push
